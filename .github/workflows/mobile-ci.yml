name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: f0bbd8333c91b52d879e7c034645887b5768b43a

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lockfile
        run: git diff --exit-code -- pubspec.lock

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze source
        run: flutter analyze

      - name: Verify release safety guards
        run: >-
          flutter test
          test/core/app_config_test.dart
          test/core/transport_configuration_test.dart
          test/features/safety/no_demo_ui_test.dart

      - name: Run test suite with coverage
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Build Android production artifact
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release App Bundle
        run: >-
          flutter build appbundle --release
          --dart-define=APP_ENV=production
          --dart-define=BASE_URL=https://ci.invalid/api/v1
          --dart-define=ENABLE_LOGGING=false

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-appbundle-unsigned-validation
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
